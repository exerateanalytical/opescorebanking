name: OPES Core Banking - 726 form contract verification
on:
  push:
    paths:
      - 'apps/opes-core-banking-forms/**'
      - '.github/workflows/opes-forms-ci.yml'
  pull_request:
    paths:
      - 'apps/opes-core-banking-forms/**'
      - '.github/workflows/opes-forms-ci.yml'
permissions:
  contents: read
jobs:
  form-contracts-and-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test 726 form schemas and fail-closed validation
        run: node --test tests/forms.test.mjs
        working-directory: apps/opes-core-banking-forms
      - name: Syntax check UI
        run: node --check src/app.js
        working-directory: apps/opes-core-banking-forms
      - name: Export 726 form contracts and CSV matrices
        run: node scripts/export-all.mjs
        working-directory: apps/opes-core-banking-forms
      - name: Validate all 726 specs and their SHA256 checksums
        run: |
          test "$(find apps/opes-core-banking-forms/dist/contracts -name '*.json' | wc -l)" -eq 726
          (cd apps/opes-core-banking-forms/dist && sha256sum --check --quiet SHA256SUMS.txt)
      - name: Package source and generated form definitions
        run: zip -q -r OPES_Core_Banking_726_Banking_Form_Prototypes.zip apps/opes-core-banking-forms apps/opes-core-banking-ui/src/catalog.js apps/opes-core-banking-ui/src/priority-contracts.js apps/opes-core-banking-ui/src/all-screen-blueprints.js -x 'apps/opes-core-banking-forms/node_modules/*' 'apps/opes-core-banking-forms/audit/*'
      - uses: actions/upload-artifact@v4
        with:
          name: OPES-726-banking-forms-source
          path: OPES_Core_Banking_726_Banking_Form_Prototypes.zip
  form-browser-audit:
    if: github.event_name == 'push'
    needs: form-contracts-and-export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.1
        working-directory: apps/opes-core-banking-forms
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/opes-core-banking-forms
      - name: Start static server
        run: (python3 -m http.server 8769 --bind 127.0.0.1 > /tmp/opes-forms-server.log 2>&1 &)
      - name: Inspect browser layouts, conditional fields and draft transitions
        run: node tests/browser-forms.mjs
        working-directory: apps/opes-core-banking-forms
      - name: Attach form browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OPES-726-banking-forms-visual-audit
          path: apps/opes-core-banking-forms/audit/*
          if-no-files-found: ignore
