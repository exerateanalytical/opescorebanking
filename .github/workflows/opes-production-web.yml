name: OPES Core Banking - React TypeScript Web
on:
  push:
    paths: ['apps/opes-core-banking-web/**','.github/workflows/opes-production-web.yml']
  pull_request:
    paths: ['apps/opes-core-banking-web/**','.github/workflows/opes-production-web.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/opes-core-banking-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
