name: OPES Bank-Local Posting Security Laboratory
on:
  push:
    paths:
      - 'engineering/labs/security-ledger/**'
      - 'engineering/labs/ledger/**'
      - '.github/workflows/sec-ledger-lab-004.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bank-local-posting-pg16:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opes_lab
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: opes_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opes_lab -d opes_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: opes_lab
      PGDATABASE: opes_lab
      PGPASSWORD: synthetic_ci_only
    steps:
      - uses: actions/checkout@v4
      - name: Install psql if necessary
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Execute bank-local membership and protected posting laboratory
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f engineering/labs/ledger/001_immutable_journal_lab.sql
          psql -X -v ON_ERROR_STOP=1 -f engineering/labs/ledger/002_journal_header_commit_validation_lab.sql
          psql -X -v ON_ERROR_STOP=1 -f engineering/labs/ledger/003_closed_journal_transaction_boundary_lab.sql
          psql -X -v ON_ERROR_STOP=1 -f engineering/labs/security-ledger/004_bank_local_atomic_posting_lab.sql
          psql -X -v ON_ERROR_STOP=1 -f engineering/labs/security-ledger/tests/004_bank_local_posting_regressions.sql
      - name: Execute cross-session revocation ordering and precommit crash laboratory
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f engineering/labs/security-ledger/tests/005_concurrency_fixture.sql
          bash engineering/labs/security-ledger/tests/005_concurrent_revocation_and_crash.sh
