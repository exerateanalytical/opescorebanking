name: OPES Core Banking full-source reconciliation
on:
  push:
    paths:
      - '.github/workflows/reconcile-core-banking.yml'
      - 'tools/reconcile_core_banking.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: opes-core-banking-reconciliation-main
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Audit all tracked content, validate ZIPs, package source
        run: python3 tools/reconcile_core_banking.py
      - name: Commit immutable audit artifacts and checksummed archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OPES Core Banking Audit"
          git config user.email "actions@users.noreply.github.com"
          git add programme/consolidated/ONE_BATCH_ENGINEERING_DELIVERY_2026-11-04/reconciliation_2026-11-04/verified_run/
          if ! git diff --cached --quiet; then
            git commit -m "audit: verified full tracked-source reconciliation and archive"
            git push origin HEAD:main
          fi
