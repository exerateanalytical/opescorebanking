name: OPES Core Banking Tenant Foundation Checks
on:
  push:
    paths:
      - 'engineering/foundation/tenant/**'
      - '.github/workflows/tenant-foundation-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-and-tenant-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: opes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opes_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install contract test dependencies
        run: python3 -m pip install --disable-pip-version-check 'pyyaml>=6,<7' 'jsonschema>=4,<5'
      - name: Execute OpenAPI strict contract tests
        run: python3 -m unittest discover -s engineering/foundation/tenant/tests -p 'test_*.py' -v
      - name: Bootstrap a non-privileged tenant runtime database role
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d opes_test -v ON_ERROR_STOP=1 -f engineering/foundation/tenant/000_test_role.sql
      - name: Apply isolated tenant laboratory schema and RLS
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d opes_test -v ON_ERROR_STOP=1 -f engineering/foundation/tenant/001_schema.sql
      - name: Execute original PostgreSQL tenant isolation and policy tests
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d opes_test -v ON_ERROR_STOP=1 -f engineering/foundation/tenant/tests/isolation.sql
      - name: Apply authenticated database-principal tenant binding
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d opes_test -v ON_ERROR_STOP=1 -f engineering/foundation/tenant/002_authenticated_principal_binding.sql
          psql -h 127.0.0.1 -U postgres -d opes_test -v ON_ERROR_STOP=1 -f engineering/foundation/tenant/tests/002_ci_login_principals.sql
      - name: Verify bank A cannot impersonate bank B by changing tenant header or GUC
        env:
          PGPASSWORD: only_testing_bank_a
        run: psql -h 127.0.0.1 -U opes_bank_a_test -d opes_test -v ON_ERROR_STOP=1 -f engineering/foundation/tenant/tests/role_isolation_a.sql
      - name: Verify bank B cannot impersonate bank A
        env:
          PGPASSWORD: only_testing_bank_b
        run: psql -h 127.0.0.1 -U opes_bank_b_test -d opes_test -v ON_ERROR_STOP=1 -f engineering/foundation/tenant/tests/role_isolation_b.sql
      - name: Verify unbound DB principal sees no institution data
        env:
          PGPASSWORD: only_testing_unbound
        run: psql -h 127.0.0.1 -U opes_unbound_test -d opes_test -v ON_ERROR_STOP=1 -f engineering/foundation/tenant/tests/role_isolation_unbound.sql
