name: OPES Core Banking Stage 3 - One Batch 25 Domain Engineering
on:
  push:
    paths:
      - 'engineering/stage3-one-batch/**'
      - '.github/workflows/opes-stage3-25-domains.yml'
  pull_request:
    paths:
      - 'engineering/stage3-one-batch/**'
      - '.github/workflows/opes-stage3-25-domains.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage3-25-domain-contracts-services-and-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opes_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify 25 typed domain contracts, shared strict service and 75 lifecycle operations
        run: NODE_ENV=test node --test engineering/stage3-one-batch/tests/*.test.mjs
      - name: Bootstrap isolated PostgreSQL 16 bank-principal binding
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d opes_test -v ON_ERROR_STOP=1 -X -f engineering/stage3-one-batch/db/000_bootstrap_disposable_pg16.sql
      - name: Apply ALL 25 domain-specific typed candidate schemas (no partial builds)
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          test "$(find engineering/stage3-one-batch/db -maxdepth 1 -name '[A-Z]*.sql' | wc -l)" -eq 25
          for file in engineering/stage3-one-batch/db/[A-Z]*.sql; do
            psql -h 127.0.0.1 -U postgres -d opes_test -v ON_ERROR_STOP=1 -X -f "$file"
          done
      - name: Seed 50 synthetic two-bank domain records
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d opes_test -v ON_ERROR_STOP=1 -X -f engineering/stage3-one-batch/db/tests/001_synthetic_seed.sql
      - name: Bank A reads exactly its own 25 domain records; DML denied
        env:
          PGPASSWORD: only_disposable_stage3_bank_a
        run: psql -h 127.0.0.1 -U opes_s3_bank_a_lab -d opes_test -v ON_ERROR_STOP=1 -X -f engineering/stage3-one-batch/db/tests/002_role_bank_a.sql
      - name: Bank B reads exactly its own 25 domain records; DML denied
        env:
          PGPASSWORD: only_disposable_stage3_bank_b
        run: psql -h 127.0.0.1 -U opes_s3_bank_b_lab -d opes_test -v ON_ERROR_STOP=1 -X -f engineering/stage3-one-batch/db/tests/003_role_bank_b.sql
      - name: Unbound bank principal sees zero records in all 25 domains
        env:
          PGPASSWORD: only_disposable_stage3_unbound
        run: psql -h 127.0.0.1 -U opes_s3_unbound_lab -d opes_test -v ON_ERROR_STOP=1 -X -f engineering/stage3-one-batch/db/tests/004_role_unbound.sql
      - name: Verify SQL role policy and 25 per-domain table structures
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          count=$(psql -h 127.0.0.1 -U postgres -d opes_test -XAtq -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='opes_stage3' AND c.relkind='r' AND c.relname LIKE '%_candidate' AND c.relrowsecurity AND c.relforcerowsecurity")
          test "$count" = 25
          echo "STAGE3_ALL_25_PG16_RLS_TABLES_VERIFIED"
