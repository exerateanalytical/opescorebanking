          curl -fL --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-5888-81f4-8080-9e0eb332d64a/raw?se=2026-11-03T04%3A45%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=90d6c093-e19f-51dd-9080-e95d69300daa&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-03T04%3A28%3A01Z&ske=2026-11-04T04%3A28%3A01Z&sks=b&skv=2026-02-06&sig=jBuZQZTathzGMeETfvGGwEgwQCq44erVpTN/EZl169Q%3D' -o regulatory/recovery/archives/OPES_Core_Banking_Checkpoint_AL_2026-10-09.zip
          curl -fL --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-040c-81f4-82ee-6d06d098b1b1/raw?se=2026-11-03T04%3A45%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=dedab852-a805-52cd-8b72-effebe4c3c79&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-03T00%3A19%3A26Z&ske=2026-11-04T00%3A19%3A26Z&sks=b&skv=2026-02-06&sig=yPZ9/aHO%2BZChds1hwCcfP20I3E5adBnrRBZxTZE9dj0%3D' -o regulatory/recovery/archives/OPES_Core_Banking_Checkpoint_AM_2026-10-09.zip

      - name: Verify cryptographic identities and ZIP integrity
        shell: bash
        run: |
          set -euo pipefail
          cd regulatory/recovery/archives
          cat > SHA256SUMS.txt <<'SUMS'
          4ac19ba584f09bed9223271536cc66482fc787b3f12c2e585a76c2a037e41dc5  OPES_Core_Banking_Checkpoint_AE_2026-10-09.zip
          93142a5d5f43fd33c12f67a2c61debd6ce374be90d49360f86a19fd9a3690b3e  OPES_Core_Banking_Checkpoint_AF_2026-10-09.zip
          2dc66f7ac1cd8570e48a2fe441e03830dd2beee0fdeaa2b9b9855fe189e978d4  OPES_Core_Banking_Checkpoint_AG_2026-10-09.zip
          4ee6565bf4fa071477daf55fe4cf14290a2d28bbeb137685878552082ce4f546  OPES_Core_Banking_Checkpoint_AH_2026-10-09.zip
          3f2489488610939b2b53046424a58d5ec9e4687103fe3b09843ff36420b31679  OPES_Core_Banking_Checkpoint_AI_2026-10-09.zip
          9f7d2b81325d3ebaf04065a203cd2ed7218fa4a90f7595449e68335262642588  OPES_Core_Banking_Checkpoint_AJ_2026-10-09.zip
          9f3d15833635b145e17416e55df007fe1dd16cecdc54dcf0b9091748151451cf  OPES_Core_Banking_Checkpoint_AK_2026-10-09.zip
          f396b94e123c7b81a0f13fa0b8163af22f6c92189afbb609892267452536a023  OPES_Core_Banking_Checkpoint_AL_2026-10-09.zip
          9d15b534696a3edc9eca4dd131b1b7c6f751c6820e571827f4f748df4a598e93  OPES_Core_Banking_Checkpoint_AM_2026-10-09.zip
          SUMS
          sha256sum -c SHA256SUMS.txt
          for f in *.zip; do unzip -tq "$f" >/dev/null; done

      - name: Commit recovered originals and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OPES Core Banking Recovery"
          git config user.email "developer@opesware.com"
          git add regulatory/recovery/archives
          git rm .github/workflows/recover-core-banking-archives.yml
          git commit -m "archive: recover original core banking checkpoints AE-AM"
          git push origin HEAD:main
