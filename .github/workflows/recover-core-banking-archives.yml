name: One-time OPES Core Banking archive recovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-core-banking-archives.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download recovered checkpoint archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p regulatory/recovery/archives
          curl -fL --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-344c-81f4-a834-5e6f00f9d5ce/raw?se=2026-11-03T04%3A45%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=13aa0cf4-9ffa-552d-97c4-9025e8454ba2&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-03T00%3A28%3A41Z&ske=2026-11-04T00%3A28%3A41Z&sks=b&skv=2026-02-06&sig=6HF7Bj/5z7CeOAdscpVO0itQE7JmPWEDNvjyjMcvq6Q%3D' -o regulatory/recovery/archives/OPES_Core_Banking_Checkpoint_AE_2026-10-09.zip
