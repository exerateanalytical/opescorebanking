          curl -fL --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-b3dc-81f4-ae22-1adb144410b2/raw?se=2026-11-03T04%3A45%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=ce4723d3-734c-52be-89b9-9c96211ccb97&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-02T22%3A50%3A51Z&ske=2026-11-03T22%3A50%3A51Z&sks=b&skv=2026-02-06&sig=z2RrWhvqlbHAYGAko3TkT1J1tMBa9hAyRMrdS0ev%2BHQ%3D' -o regulatory/recovery/archives/OPES_Core_Banking_Checkpoint_AG_2026-10-09.zip
          curl -fL --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-45bc-81f4-a7e8-e557235ce8a4/raw?se=2026-11-03T04%3A45%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=7f00e3d2-4808-513f-b391-1854f674fe34&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-03T00%3A19%3A26Z&ske=2026-11-04T00%3A19%3A26Z&sks=b&skv=2026-02-06&sig=VMdWf2IslYsLgmCnjRo94XAyR9BAKB1RKnlnrXIcMSQ%3D' -o regulatory/recovery/archives/OPES_Core_Banking_Checkpoint_AH_2026-10-09.zip
