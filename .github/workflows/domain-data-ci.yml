name: OPES Core Banking Four-Domain PostgreSQL Constraints
on:
  push:
    paths:
      - 'engineering/domain-data-lab/**'
      - '.github/workflows/domain-data-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  composite-bank-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opes_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d opes_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap bank-specific principals and synthetic membership
        env:
          PGPASSWORD: postgres
        run: |
          set -e
          for file in engineering/foundation/tenant/000_test_role.sql engineering/foundation/tenant/001_schema.sql engineering/foundation/tenant/tests/isolation.sql engineering/foundation/tenant/002_authenticated_principal_binding.sql engineering/foundation/tenant/tests/002_ci_login_principals.sql; do
            psql -h 127.0.0.1 -U postgres -d opes_test -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Apply hardened CIF PRD ACT LED domain proposal schemas
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d opes_test -v ON_ERROR_STOP=1 -f engineering/domain-data-lab/001_schema.sql
          psql -h 127.0.0.1 -U postgres -d opes_test -v ON_ERROR_STOP=1 -f engineering/domain-data-lab/tests/002_synthetic_seed.sql
      - name: Test authenticated bank A foreign keys constraints lifecycle and spoofing
        env:
          PGPASSWORD: only_testing_bank_a
        run: psql -h 127.0.0.1 -U opes_bank_a_test -d opes_test -v ON_ERROR_STOP=1 -f engineering/domain-data-lab/tests/role_a.sql
      - name: Test authenticated bank B cannot read bank A customer product or financial draft
        env:
          PGPASSWORD: only_testing_bank_b
        run: psql -h 127.0.0.1 -U opes_bank_b_test -d opes_test -v ON_ERROR_STOP=1 -f engineering/domain-data-lab/tests/role_b.sql
